                  value:
                    code: 63
                    error: This API key does not match your FFScouter account.
                    source: ffscouter
                sellerNotOkay:
                  value:
                    code: 71
                    error: >-
                      You must be Okay in Torn to claim a contract. Leave hospital, jail, or travel
                      first.
                    source: ffscouter
                targetNotOkay:
                  value:
                    code: 72
                    error: >-
                      This target is temporarily unavailable (not Okay in Torn). Try again later.
                    source: ffscouter
                ownTarget:
                  value:
                    code: 51
                    error: You cannot claim losses on a contract where you are the target.
                    source: ffscouter
                ownOrder:
                  value:
                    code: 52
                    error: You cannot claim losses on your own order.
                    source: ffscouter
                sellerStatsRequired:
                  value:
                    code: 68
                    error: >-
                      Your battle stats are not available yet. Register or refresh your FFScouter API
                      key, then try again.
                    source: ffscouter
                tornRejected:
                  value:
                    code: 61
                    error: Too many requests
                    source: torn
                    torn_code: 5
                tooStrong:
                  value:
                    code: 69
                    error: >-
                      You are too strong for this contract target. You may only claim when your battle
                      stats are at most half of the target's public estimate.
                    source: ffscouter
                targetStatsUnavailable:
                  value:
                    code: 79
                    error: >-
                      This contract target has no public battle-stat estimate yet. Try another
                      contract.
                    source: ffscouter
        '404':
          description: Contract not found (code 49) or not available for claims (code 50).
          content:
            application/json:
              schema:
