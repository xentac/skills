          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: 3
                    error: Invalid API key. Please sign up at ffscouter.com to use this service
        '429':
          description: Rate limit exceeded (code 21). 70 requests per minute per IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rateLimited:
                  value:
                    code: 21
                    error: Rate limit exceeded. Please retry shortly.
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server:
                  value:
                    code: 500
                    error: An error occurred while retrieving your transaction history

  /api/v1/account/faction/transactions:
    get:
      operationId: getFactionAccountTransactions
      tags: [Account]
      summary: Get the last 10 faction balance transactions
      description: >-
        Returns the 10 most recent faction balance transactions, newest first. Requires the
        caller's faction role to pass the faction balance view permission set by the leader or
        co-leader.
      parameters:
        - $ref: '#/components/parameters/KeyQuery'
      x-laravel-middleware: ['throttle:70,1']
      responses:
        '200':
          description: Recent faction transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactionTransactionsResponse'
              examples:
                default:
                  value:
                    faction_id: 12345
                    transactions:
                      - id: 1
                        type: deposit
                        amount: 850000
                        balance_before: 0
                        balance_after: 850000
                        source: deposit
                        comment: 'Xanax deposit from player 267456763 (1 at 850,000)'
                        reference_id: '123456789'
                        created_at: 1766196069
                        player_id: 267456763
                    count: 1
        '400':
          description: Missing or invalid API key format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing:
                  value:
                    code: 1
                    error: API key is required
                badFormat:
                  value:
                    code: 2
                    error: Invalid API key format. Key must be 16 alphanumeric characters
        '401':
          description: API key is not registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    code: 3
                    error: Invalid API key. Please sign up at ffscouter.com to use this service
        '403':
          description: The caller's faction role does not have the view permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: 4030
                    error: You do not have permission to view the faction balance.
        '404':
          description: The caller is not in a faction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noFaction:
                  value:
                    code: 4040
                    error: You are not in a faction.
        '429':
          description: Rate limit exceeded (code 21). 70 requests per minute per IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rateLimited:
                  value:
                    code: 21
                    error: Rate limit exceeded. Please retry shortly.
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                server:
                  value:
                    code: 500
                    error: An error occurred while retrieving the faction transaction history

components:
  securitySchemes:
    FfscouterKey:
      type: apiKey
      in: query
      name: key
      description: Registered 16-character FFScouter API key.
    OrderSecret:
      type: apiKey
      in: query
      name: key
      description: 14-character order secret returned when a loss order is created.

  parameters:
    KeyQuery:
      name: key
      in: query
      required: true
      description: Registered 16-character FFScouter API key.
      schema:
        type: string
        pattern: '^[A-Za-z0-9]{16}$'
    OrderSecretQuery:
      name: key
      in: query
      required: true
      description: 14-character order secret.
      schema:
        type: string
        pattern: '^[A-Za-z0-9]{14}$'
    OrderNumberPath:
      name: orderNumber
      in: path
      required: true
      description: Loss order number.
      schema:
        type: string
    ClaimIdPath:
      name: claimId
      in: path
      required: true
      description: Numeric claim ID.
      schema:
        type: integer
        minimum: 1
    NoteUuidPath:
      name: uuid
      in: path
      required: true
      description: Note UUID returned when the note was created.
      schema:
        type: string
        format: uuid
    ActivityStart:
      name: start
      in: query
      required: true
      description: Range start, Unix seconds inclusive.
      schema:
        type: integer
    ActivityEnd:
      name: end
      in: query
      required: true
      description: Range end, Unix seconds exclusive.
      schema:
        type: integer
    ActivityBucket:
      name: bucket
      in: query
      description: Bucket width in seconds.
      schema:
        type: integer
        enum: [300, 900, 3600]
        default: 300

  schemas:
    Error:
      type: object
      required: [code, error]
      properties:
        code:
          type: integer
        error:
          type: string
        source:
          type: string
          enum: [ffscouter, torn]
          description: >-
            Where the failure came from. "torn" is used when FFScouter called the
            Torn API on the user's behalf and Torn returned an error that halted
            the request. Defaults to "ffscouter" when omitted.
        torn_code:
          type: integer
          nullable: true
          description: Torn's numeric error code when source is "torn".
        retry_after_seconds:
          type: integer
          nullable: true
        detail:
          type: string
          nullable: true

    AccountTransaction:
      type: object
      required:
        - id
        - type
        - amount
        - balance_before
        - balance_after
        - source
        - comment
        - reference_id
        - created_at
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [deposit, withdrawal, credit, debit]
        amount:
          type: integer
        balance_before:
          type: integer
        balance_after:
          type: integer
        source:
          type: string
        comment:
          type: string
          nullable: true
        reference_id:
          type: string
          nullable: true
        created_at:
          type: integer
          nullable: true

    AccountTransactionsResponse:
      type: object
      required: [transactions, count]
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/AccountTransaction'
        count:
          type: integer

    FactionBalanceSummary:
      type: object
      required: [faction_id, name, tag, viewer_role, can_view, can_spend, balance]
      properties:
        faction_id:
          type: integer
        name:
          type: string
          nullable: true
        tag:
          type: string
          nullable: true
        viewer_role:
          type: string
          enum: [leader, co_leader, whitelisted_leader, member]
        can_view:
          type: boolean
        can_spend:
          type: boolean
        balance:
          type: integer
          nullable: true

    AccountBalanceResponse:
      type: object
      required:
        - player_id
        - balance
        - deposits_enabled
        - deposit_message
        - faction_deposit_message
        - payment_value_per_xanax
        - faction
      properties:
        player_id:
          type: integer
        balance:
          type: integer
        deposits_enabled:
          type: boolean
        deposit_message:
          type: string
        faction_deposit_message:
          type: string
        payment_value_per_xanax:
          type: integer
          nullable: true
        faction:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FactionBalanceSummary'

    FactionTransactionsResponse:
      type: object
      required: [faction_id, transactions, count]
      properties:
        faction_id:
          type: integer
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/FactionTransaction'
        count:
          type: integer

    FactionTransaction:
      allOf:
        - $ref: '#/components/schemas/AccountTransaction'
        - type: object
          required: [player_id]
          properties:
            player_id:
              type: integer
              nullable: true
              description: >-
                The player who caused the change (depositor or staff member), or null when
                the change was not attributable to a player.

