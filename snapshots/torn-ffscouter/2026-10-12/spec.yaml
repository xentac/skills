  /api/v1/losses/orders:
    post:
      operationId: createLossOrder
      tags: [Losses]
      summary: Place a loss order
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player_id, quantity, price_per_loss]
              properties:
                player_id:
                  type: integer
                  minimum: 1
                quantity:
                  type: integer
                  minimum: 10
                price_per_loss:
                  type: integer
                  minimum: 350000
                  maximum: 1000000
                referrer_player_id:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: >-
