  /api/v1/register:
    post:
      operationId: registerKey
      tags: [API Keys]
      summary: Register an API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, agree_to_data_policy, signup_source]
              properties:
                key:
                  type: string
                  pattern: '^[A-Za-z0-9]{16}$'
                agree_to_data_policy:
                  type: boolean
                  enum: [true]
                signup_source:
                  type: string
                  minLength: 3
                  maxLength: 30
            examples:
              default:
                value:
                  key: EXAMPLEKEY000000
                  agree_to_data_policy: true
                  signup_source: MyTool
      responses:
        '200':
          description: Key registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                default:
                  value:
                    success: true
                    key: EXAMPLEKEY000000
                    message: API key successfully registered.
        '400':
          description: >-
            Invalid request. Codes: 1 API key required, 2 invalid key format, 3 policy not accepted,
            4 missing signup_source, 5 invalid signup_source, 9 reserved signup_source, all with source
            ffscouter. Code 6 means the key was rejected: source torn with torn_code when Torn returned an
            error, source ffscouter with a permission reason for a Public, Minimal, or incomplete Custom
            key, or source ffscouter for internal failures such as a concurrent update. Registering
            requires a Limited or Full key, or a Custom key with basic, battlestats, attacks, and hof
            (personalstats is optional).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingKey:
                  value:
                    code: 1
                    error: API key is required
                    source: ffscouter
                invalidKeyFormat:
                  value:
                    code: 2
                    error: Invalid API key format. Key must be 16 alphanumeric characters
                    source: ffscouter
                policyNotAccepted:
                  value:
                    code: 3
                    error: You must confirm agree_to_data_policy to register
                    source: ffscouter
                missingSignupSource:
                  value:
                    code: 4
                    error: signup_source is required
                    source: ffscouter
                invalidSignupSource:
                  value:
                    code: 5
                    error: signup_source must be 3-30 alphanumeric characters with no spaces
                    source: ffscouter
                reservedSignupSource:
                  value:
                    code: 9
                    error: signup_source is reserved for FFScouter website registrations
                    source: ffscouter
                permissionRejected:
                  value:
                    code: 6
                    error: You provided a Public Only key. You should use a Limited or Full Key to sign up.
                    source: ffscouter
                customKeyMissingSelections:
                  value:
                    code: 6
                    error: You are using a custom key missing the required permissions. Try using a Limited Key.
                    source: ffscouter
                tornError:
                  value:
                    code: 6
                    error: Torn rejected this API key. Please check that the key is correct and try again.
                    source: torn
                    torn_code: 2
        '403':
          description: The key owner or their faction is banned (codes 4010, 4011).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                accountBanned:
                  value:
                    code: 4010
                    error: >-
                      Your account is banned from FFScouter. Join the FFScouter Discord if you have any
                      questions. https://discord.gg/Gzr7Rb3Y5f
                factionBanned:
                  value:
                    code: 4011
                    error: >-
                      Your faction is banned from FFScouter. Join the FFScouter Discord if you have any
                      questions. https://discord.gg/Gzr7Rb3Y5f
        '409':
          description: Key already registered (code 8, source ffscouter).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyRegistered:
                  value:
                    code: 8
                    error: API key is already registered
                    source: ffscouter
        '429':
          description: Rate limited by the route throttle (code 21, 10 requests per minute per IP address) or the 3-per-minute registration limit (code 7, source ffscouter).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                throttled:
                  value:
                    code: 21
                    error: Rate limit exceeded. Please retry shortly.
                    retry_after_seconds: 12
                registrationLimited:
                  value:
                    code: 7
