  /api/v1/bounties/seller/claims:
    post:
      operationId: submitBountySellerClaim
      tags: [Bounty Board]
      summary: Submit a bounty monitoring claim
      description: >-
        Opens a monitoring session for the seller. The server reads the seller's Torn attack log
        until 5 successful, non-empty reads complete, and credits every Hospitalized hit they made
        in the last 24 hours against each eligible open bounty. A hit can match a player bounty on
        the defender and/or a faction bounty for the defender's faction; the highest-paying
        eligible order wins. target_player_id and target_faction_id are optional hints stored for
        display only and never restrict which bounties can be credited. An existing open claim for
        the seller is reused. Responses return only the authenticated seller's own claims and hits;
        buyer identity is never included.
      security:
        - FfscouterKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  pattern: '^[A-Za-z0-9]{16}$'
                  description: Registered 16-character FFScouter API key.
                target_player_id:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: >-
                    Optional hint: Torn player ID the seller intends to hit. Stored for display only;
                    crediting always considers every eligible open bounty. Provide either
                    target_player_id or target_faction_id, never both.
                target_faction_id:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: >-
                    Optional hint: Torn faction ID the seller intends to hit. Stored for display only;
                    crediting always considers every eligible open bounty. Provide either
                    target_player_id or target_faction_id, never both.
                referrer_player_id:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: >-
                    Optional player ID to receive the script commission for credited hits. Invalid values, players who are not approved commission recipients, the claimant, and the buyer are ignored. Reused open claims keep their original attribution. The website omits it.
            examples:
              default:
                value:
                  key: EXAMPLEKEY000000
                  target_player_id: 267456763
                  referrer_player_id: 1844049
              faction:
                value:
                  key: EXAMPLEKEY000000
                  target_faction_id: 6731
              noHint:
                value:
                  key: EXAMPLEKEY000000
      responses:
        '200':
          description: An open claim for this seller was refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BountyClaimCreateResponse'
              examples:
                default:
                  value:
                    claim:
                      id: 42
                      target_player_id: 267456763
                      target_faction_id: null
                      state: verifying
                      successful_checks: 2
                      required_checks: 5
                      credited_hits: 0
                    claims:
                      pending_claims:
                        - claim_id: 42
                          target_player_id: 267456763
                          target_faction_id: null
                          target_name: Arcanine
                          state: verifying
                          successful_checks: 2
                          required_checks: 5
                          failed_attempts: 0
                          last_failure_reason: null
                          credited_hits: 0
                          created_at: 1770001300
                      recent_hits: []
                      claim_history: []
        '201':
          description: >-
            Claim created. The server verifies the seller's attack log against every eligible open
            bounty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BountyClaimCreateResponse'
              examples:
                default:
                  value:
                    claim:
                      id: 43
                      target_player_id: 267456763
                      target_faction_id: null
                      state: verifying
                      successful_checks: 0
                      required_checks: 5
                      credited_hits: 0
                    claims:
                      pending_claims:
                        - claim_id: 43
                          target_player_id: 267456763
                          target_faction_id: null
                          target_name: Arcanine
                          state: verifying
                          successful_checks: 0
                          required_checks: 5
                          failed_attempts: 0
                          last_failure_reason: null
                          credited_hits: 0
                          created_at: 1770001500
                      recent_hits: []
                      claim_history: []
        '400':
          description: Torn rejected the seller key (code 87).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tornRejected:
                  value:
                    code: 87
                    error: >-
                      Torn rejected this API key. Ensure it is a valid Limited, Full or Custom key with
                      attacks access.
                    source: ffscouter
        '401':
          description: The API key is not registered (code 6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidKey:
                  value:
                    code: 6
                    error: Invalid API key
                    source: ffscouter
        '403':
          description: >-
            Policy consent not accepted (code 86) or the key does not belong to the authenticated
            player (code 89).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                consentRequired:
                  value:
                    code: 86
                    error: >-
                      Accept the Bounty Board Data Policy and Rules before viewing bounties.
                    source: ffscouter
                keyMismatch:
                  value:
                    code: 89
                    error: This API key does not belong to your player.
                    source: ffscouter
        '409':
          description: >-
            No open bounties available to this seller (code 91).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notBountied:
                  value:
                    code: 91
                    error: No open bounties available.
                    source: ffscouter
        '429':
          description: Rate limit exceeded (code 21). 30 requests per minute per IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                throttled:
                  value:
                    code: 21
                    error: Rate limit exceeded. Please retry shortly.
                    retry_after_seconds: 12
        '503':
          description: The seller key could not be validated with Torn right now (code 88).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validationUnavailable:
                  value:
                    code: 88
                    error: >-
                      We could not validate your API key with Torn right now. Please try again shortly.
                    source: ffscouter
      x-laravel-middleware:
        - 'throttle:bounties-seller-claim-submit'

  /api/v1/notes:
    get:
      operationId: listNotes
      tags: [Notes]
      summary: List notes visible to the caller
      description: >-
        Returns notes visible to the API key owner: their own personal notes, their current faction's
        notes, and FFScouter team notes, newest first, up to 100 per page. Deleted notes are hidden
        unless include_deleted is set; deleted FFScouter notes are never returned. Note content is
        plaintext and must be rendered as text, never as HTML, code, or links.
      parameters:
        - $ref: '#/components/parameters/KeyQuery'
        - name: target_type
          in: query
          description: Filter by target type. Must be combined with target_id.
          schema:
            type: string
            enum: [player, faction]
        - name: target_id
          in: query
          description: Target ID between 1 and 9999999. Must be combined with target_type.
          schema:
            type: integer
            minimum: 1
            maximum: 9999999
        - name: targets
          in: query
          description: >-
            Comma-separated player IDs (up to 205) for a batch lookup. Cannot be combined with
            target_type or target_id.
          schema:
            type: string
          example: '1844049,2675763'
        - name: scope
          in: query
          description: Only return notes of this scope.
          schema:
            type: string
            enum: [personal, faction, ffscouter]
        - name: include_deleted
          in: query
          description: Include soft-deleted notes the caller is allowed to see.
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Page size, up to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Paginated notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResponse'
              examples:
                default:
                  value:
                    notes:
                      - uuid: 4c3f0f6e-8b3a-4f0e-9a4e-2f4b6c8d0e12
                        scope: faction
                        target_type: player
                        target_id: 1844049
                        content: Watch for war activity on weekends.
                        created_at: 1769295473
                        deleted_at: null
                        author_player_id: 2675763
                        author_name: Someone
                        can_soft_delete: true
                        can_purge: false
                    pagination:
                      page: 1
                      limit: 100
                      total: 1
                      total_pages: 1
        '400':
          description: >-
            Invalid request. Codes: 1 API key required, 2 invalid key format, 50 invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingKey:
                  value:
                    code: 1
                    error: API key is required
                invalidKeyFormat:
                  value:
                    code: 2
                    error: Invalid API key format. Key must be 16 alphanumeric characters
                invalidTarget:
                  value:
                    code: 50
                    error: target_id must be an integer between 1 and 9999999
        '401':
          description: Invalid API key (code 6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidKey:
                  value:
                    code: 6
                    error: Invalid API key. Please sign up at ffscouter.com to use this service
        '429':
          description: Rate limit exceeded (code 20). Reads allow 120 requests per minute per account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                throttled:
                  value:
                    code: 20
                    error: Rate limit exceeded. Maximum 120 requests per minute per account.
                    retry_after_seconds: 30
      x-laravel-middleware:
        - 'notes.api'
        - 'throttle.notes.query'
    post:
