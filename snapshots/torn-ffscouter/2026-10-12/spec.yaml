                invalidKey:
                  value:
                    code: 6
                    error: Invalid API key
                    source: ffscouter
        '403':
          description: >-
            Service key (code 58), Torn rejected the key (code 61), key/account mismatch (code 63),
            seller not Okay in Torn (code 71), target not Okay (code 72), claiming as the target or
            own order (codes 51, 52), or missing battle stats (codes 68, 69, 79).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                serviceKey:
                  value:
