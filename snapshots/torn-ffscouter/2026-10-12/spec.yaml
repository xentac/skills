          schema:
            type: integer
            minimum: 10
          example: 10
        - name: price_per_loss
          in: query
          required: true
          description: Offer per loss in Torn dollars (350000 to 1000000, 25000 increments).
          schema:
            type: integer
            minimum: 350000
            maximum: 1000000
          example: 350000
      responses:
        '200':
          description: Quote and seller queue stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LossOrderQuote'
              examples:
                default:
                  value:
                    subtotal: 3500000
                    fee_amount: 700000
                    total_payable: 4200000
                    payment_value_per_xanax: 784000
                    expected_xanax_quantity: 6
                    fee_percent: 0.2
                    xanax_payment_value_total: 4704000
                    xanax_overage_value: 504000
                    same_xanax_max_quantity: 11
                    same_xanax_extra_losses: 1
                    same_xanax_total_payable: 4620000
                    highest_price_per_loss: 400000
                    highest_price_slots_available: 35
                    higher_priced_slots_available: 0
                    active_slots_by_price:
                      - price_per_loss: 400000
                        slots_available: 35
                      - price_per_loss: 350000
                        slots_available: 120
        '400':
          description: Invalid quantity or price (codes 39, 40, 76).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                minQuantity:
                  value:
                    code: 39
                    error: Quantity must be at least 10.
                offGridPrice:
                  value:
                    code: 40
                    error: Price per loss must be between $350,000 and $1,000,000 in $25,000 steps.
                quantityRangeOverflow:
                  value:
                    code: 76
                    error: Quantity at this price exceeds the supported integer range.
        '429':
          description: Rate limit exceeded (code 21). 30 requests per minute per IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                throttled:
                  value:
                    code: 21
                    error: Rate limit exceeded. Please retry shortly.
                    retry_after_seconds: 12
        '503':
          description: Pricing temporarily unavailable (codes 44, 45, 46).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                marketUnavailable:
                  value:
                    code: 44
                    error: Item 206 market price is not available. Please try again shortly.
                paymentValueTooLow:
                  value:
                    code: 45
                    error: Xanax payment value is below the minimum allowed. Contact support.
