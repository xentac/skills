      operationId: storeTornStatsKey
      tags: [TornStats]
      summary: Save or replace the caller's TornStats API key
      description: >-
        Stores or replaces the TornStats API key for the FFScouter API key owner and queues a spy
        sync for their faction. The key is validated with TornStats and encrypted at rest. The
        TornStats key and its masked form are never returned by the API; use GET /api/v1/check-key
        for integration status. The required consent must be true; the machine learning consent is
        optional and defaults to false.
      parameters:
        - $ref: '#/components/parameters/KeyQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tornstats_api_key
                - consent_to_retrieve_and_store_tornstats_spies_self_and_faction
              properties:
                tornstats_api_key:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: '^TS_[A-Za-z0-9]+$'
                  description: TornStats API key in TS_xxxxxxxx format.
                consent_to_retrieve_and_store_tornstats_spies_self_and_faction:
                  type: boolean
                  enum: [true]
                  description: >-
                    Must be true. Consent to FFScouter retrieving and storing TornStats spies for the
                    caller and their faction.
                consent_to_allowing_data_use_for_machine_learning:
                  type: boolean
                  default: false
                  description: >-
                    Optional consent to using the caller's TornStats spies to train machine learning
                    algorithms.
            examples:
              default:
                value:
                  tornstats_api_key: TS_xxxxxxxx
                  consent_to_retrieve_and_store_tornstats_spies_self_and_faction: true
                  consent_to_allowing_data_use_for_machine_learning: false
      responses:
        '200':
          description: Key saved or replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TornStatsKeyResponse'
              examples:
                saved:
                  value:
                    success: true
                    message: TornStats key saved. Initial spy sync has been queued.
                    tornstats_integration_enabled: true
                    tornstats_key_in_place: true
        '400':
          description: >-
            Invalid request. Codes: 1 API key required, 2 invalid key format, 60 invalid TornStats key
            format, 61 required consent not accepted, 62 caller not in a faction, 63 TornStats rejected
            the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingKey:
                  value:
                    code: 1
                    error: API key is required
                invalidKeyFormat:
                  value:
                    code: 2
                    error: Invalid API key format. Key must be 16 alphanumeric characters
                invalidTornStatsKey:
                  value:
                    code: 60
                    error: Enter a valid TornStats API key (format TS_xxxxxxxx).
                consentRequired:
                  value:
                    code: 61
                    error: You must accept the required consent to enable TornStats.
                notInFaction:
                  value:
                    code: 62
                    error: You must be in a faction to enable TornStats integration.
                tornStatsRejected:
                  value:
                    code: 63
                    error: TornStats key validation failed.
        '401':
          description: Invalid API key (code 6). The demo key is rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidKey:
                  value:
                    code: 6
                    error: Invalid API key. Please sign up at ffscouter.com to use this service
        '429':
          description: Rate limit exceeded (code 20). 3 requests per minute per account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                throttled:
                  value:
                    code: 20
                    error: Rate limit exceeded. Maximum 3 requests per minute per account.
                    retry_after_seconds: 30
        '503':
          description: >-
            Could not verify the caller's faction membership (code 64). Retry shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                factionRefreshFailed:
                  value:
                    code: 64
                    error: Could not verify your faction membership. Try again shortly.
      x-laravel-middleware:
        - 'tornstats.api'
        - 'throttle.tornstats.key'

  /api/v1/get-targets:
    get:
      operationId: getTargets
      tags: [Targets]
      summary: Search for target candidates
      parameters:
        - $ref: '#/components/parameters/KeyQuery'
        - name: preset
          in: query
          description: Preset mode. When set, only key and limit are allowed.
          schema:
            type: string
            enum: [respect, level]
        - name: minlevel
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: maxlevel
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: inactiveonly
          in: query
          schema:
            type: integer
            enum: [0, 1]
        - name: minff
          in: query
          schema:
            type: number
            minimum: 1
        - name: maxff
          in: query
          schema:
            type: number
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: factionless
          in: query
          schema:
            type: integer
            enum: [0, 1]
        - name: elimination_teams
          in: query
          description: Repeated canonical Elimination team names.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Matching targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetsResponse'
              examples:
                default:
                  value:
                    parameters:
                      key: EXAMPLEKEY000000
                      preset: null
                      minlevel: 1
                      maxlevel: 100
                      inactiveonly: 0
                      minff: 1
                      maxff: 10
                      limit: 50
                      factionless: 0
                      generated_at: 1640995200
                    targets:
                      - player_id: 12345
                        name: PlayerName
                        level: 25
                        fair_fight: 1.8
                        bss_public: 50000
                        bss_public_timestamp: 1640995000
                        bs_estimate: 6750000
                        bs_estimate_human: 6.75m
                        last_action: 1640994000
                        source: bss
        '400':
          description: >-
            Invalid filters. Codes: 1 API key required, 2 invalid key format, 7 invalid preset,
            8/9 invalid minlevel/maxlevel, 10 minlevel above maxlevel, 11 invalid inactiveonly,
            12/13 invalid minff/maxff, 14 minff above maxff, 15 extra parameters with preset,
            16 invalid limit, 18 invalid factionless, 19 invalid elimination_teams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingKey:
                  value:
                    code: 1
                    error: API key is required
                invalidKeyFormat:
                  value:
                    code: 2
                    error: Invalid API key format. Key must be 16 alphanumeric characters
                invalidPreset:
                  value:
                    code: 7
                    error: Invalid preset value. Must be "respect", "level"
                invalidMinLevel:
                  value:
                    code: 8
                    error: minlevel must be an integer between 1 and 100
                invalidMaxLevel:
                  value:
                    code: 9
                    error: maxlevel must be an integer between 1 and 100
                minLevelAboveMaxLevel:
                  value:
                    code: 10
                    error: minlevel cannot be greater than maxlevel
                invalidInactiveOnly:
                  value:
                    code: 11
                    error: inactiveonly must be 0 or 1
                invalidMinFf:
                  value:
                    code: 12
                    error: minff must be a number greater than or equal to 1
                invalidMaxFf:
                  value:
                    code: 13
                    error: maxff must be a number greater than or equal to 1
                minFfAboveMaxFf:
                  value:
                    code: 14
                    error: minff cannot be greater than maxff
                presetConflict:
                  value:
                    code: 15
                    error: When preset is specified, only "key" and "limit" parameters are allowed
                invalidLimit:
                  value:
                    code: 16
                    error: limit must be an integer between 1 and 50
                invalidFactionless:
                  value:
                    code: 18
                    error: factionless must be 0 or 1
                invalidEliminationTeams:
                  value:
                    code: 19
                    error: elimination_teams must include at least one team name
        '401':
          description: The API key is not registered (code 6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidKey:
                  value:
                    code: 6
                    error: Invalid API key. Please sign up at ffscouter.com to use this service
        '403':
          description: The key owner or their faction is banned (codes 4010, 4011).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                accountBanned:
                  value:
                    code: 4010
                    error: >-
                      Your account is banned from FFScouter. Join the FFScouter Discord if you have any
                      questions. https://discord.gg/Gzr7Rb3Y5f
                factionBanned:
                  value:
                    code: 4011
                    error: >-
                      Your faction is banned from FFScouter. Join the FFScouter Discord if you have any
                      questions. https://discord.gg/Gzr7Rb3Y5f
        '404':
          description: No targets matched the filters (code 17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                none:
                  value:
                    code: 17
                    error: No targets found matching the specified criteria
        '429':
          description: Rate limit exceeded (code 21). 25 requests per minute per IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                throttled:
                  value:
                    code: 21
                    error: Rate limit exceeded. Please retry shortly.
                    retry_after_seconds: 12
      x-laravel-middleware:
        - 'throttle:25,1'

  /api/v1/bounties/orders/quote:
    get:
      operationId: quoteBountyOrder
      tags: [Bounty Board]
      summary: Quote the cost of a bounty order
      security: []
      parameters:
        - name: quantity
          in: query
          required: true
          description: Number of hits to buy (1 to 1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          example: 10
        - name: price_per_hit
          in: query
          required: true
          description: Seller reward per hit in dollars (300000 to 10000000).
          schema:
            type: integer
            minimum: 300000
            maximum: 10000000
          example: 500000
      responses:
        '200':
          description: >-
            The buyer quote. The tiered fee is added on top of the seller reward: 1-4 hits 35 percent,
            5-9 hits 30 percent, 10-99 hits 25 percent, 100+ hits 20 percent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BountyQuoteResponse'
              examples:
                default:
                  value:
                    quote:
                      subtotal: 5000000
                      fee_amount: 1250000
                      total_payable: 6250000
                      fee_percent: 0.25
                      payment_value_per_xanax: 1200000
                      expected_xanax_quantity: 6
                      xanax_overage_value: 950000
        '400':
          description: Quantity at this price exceeds the supported integer range (code 85).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLarge:
                  value:
                    code: 85
                    error: Quantity at this price exceeds the supported integer range.
                    source: ffscouter
        '422':
          description: Price per hit (code 82) or quantity (code 83) is outside the marketplace range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                priceOutOfRange:
                  value:
                    code: 82
                    error: Price per hit must be between $300,000 and $10,000,000.
                    source: ffscouter
                quantityOutOfRange:
                  value:
                    code: 83
                    error: Quantity must be between 1 and 1000 hits.
                    source: ffscouter
        '429':
          description: Rate limit exceeded (code 21). 120 requests per minute per IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                throttled:
                  value:
                    code: 21
                    error: Rate limit exceeded. Please retry shortly.
                    retry_after_seconds: 12
        '503':
          description: >-
            Item 206 market price is unavailable (code 80) or the Xanax payment value is below the
            minimum (code 81).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                marketUnavailable:
                  value:
                    code: 80
                    error: Item 206 market price is not available. Please try again shortly.
                    source: ffscouter
                paymentValueTooLow:
                  value:
                    code: 81
                    error: Xanax payment value is below the minimum allowed. Contact support.
                    source: ffscouter
      x-laravel-middleware:
        - 'throttle:bounties-quote'

  /api/v1/bounties/orders:
    post:
      operationId: createBountyOrder
      tags: [Bounty Board]
      summary: Place a bounty order
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, price_per_hit]
              properties:
                target_player_id:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: >-
                    Torn player ID. The player must already exist in FFScouter. Provide either
                    target_player_id or target_faction_id, never both.
                target_faction_id:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: >-
                    Torn faction ID. The faction must already exist in FFScouter with at least one known
                    member. Every member shares one pool of hits. Provide either target_player_id or
                    target_faction_id, never both.
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 1000
                price_per_hit:
                  type: integer
                  minimum: 300000
                  maximum: 10000000
                referrer_player_id:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: >-
                    Optional player ID to receive the script commission for this order. Invalid values, players who are not approved commission recipients, and the buyer are ignored. The website omits it.
            examples:
              default:
                value:
                  target_player_id: 267456763
                  quantity: 10
                  price_per_hit: 500000
                  referrer_player_id: 1844049
              faction:
                value:
                  target_faction_id: 6731
                  quantity: 10
                  price_per_hit: 500000
      responses:
        '201':
          description: >-
            Order created. Pay with item 206 (Xanax) to the message in payment_instructions, exactly.
            Partial payments accumulate; the bounty is released to sellers once fully funded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BountyOrderCreateResponse'
              examples:
                default:
                  value:
                    order:
                      reference: B1234567A
                      status_token: '01234567890123'
                      status_url: https://ffscouter.com/buy-bounties/01234567890123
                      payment_instructions:
                        quantity_remaining: 6
                        message: 'bounty:B1234567A'
                        xanax_expected: 6
                        xanax_received: 0
                        total_payable: 6250000
                        payment_value_per_xanax: 1200000
                        payment_deadline_at: 1770007200
        '400':
          description: Quantity at this price exceeds the supported integer range (code 85).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tooLarge:
                  value:
                    code: 85
                    error: Quantity at this price exceeds the supported integer range.
                    source: ffscouter
        '422':
          description: >-
            Price per hit (code 82), quantity (code 83), target player not found (code 84), target
            faction not found or empty (code 96), both targets supplied (code 97), no target supplied
            (code 84), or target player excluded from player bounties (code 99).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                priceOutOfRange:
                  value:
                    code: 82
                    error: Price per hit must be between $300,000 and $10,000,000.
                    source: ffscouter
                quantityOutOfRange:
                  value:
                    code: 83
                    error: Quantity must be between 1 and 1000 hits.
                    source: ffscouter
                targetNotFound:
                  value:
                    code: 84
                    error: >-
                      Target player was not found in FFScouter. The player must be known before a bounty
                      can be placed.
                    source: ffscouter
                targetFactionNotFound:
                  value:
                    code: 96
                    error: >-
                      Target faction was not found in FFScouter. The faction must be known before a
                      bounty can be placed.
                    source: ffscouter
                targetAmbiguous:
                  value:
                    code: 97
                    error: Provide either a target player or a target faction, not both.
                    source: ffscouter
                targetExcluded:
                  value:
                    code: 99
                    error: This player cannot be targeted with bounties.
                    source: ffscouter
        '429':
          description: Rate limit exceeded (code 21). 10 requests per minute per IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                throttled:
                  value:
                    code: 21
                    error: Rate limit exceeded. Please retry shortly.
                    retry_after_seconds: 12
        '503':
          description: >-
            Item 206 market price is unavailable (code 80) or the Xanax payment value is below the
            minimum (code 81).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                marketUnavailable:
                  value:
                    code: 80
                    error: Item 206 market price is not available. Please try again shortly.
                    source: ffscouter
                paymentValueTooLow:
                  value:
                    code: 81
                    error: Xanax payment value is below the minimum allowed. Contact support.
                    source: ffscouter
      x-laravel-middleware:
        - 'throttle:bounties-order-create'

