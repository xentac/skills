openapi: 3.0.4

info:
  title: FFScouter API
  version: 1.14.0
  description: |
    Public FFScouter API for battle stat estimates, player flights, activity, hit calling, the losses marketplace, targets, and public statistics. If developing scripts to use these endpoints, ensure you provide a link to the data policy of each feature where it applies in accordance with Torn's rules. You must not use data from FFScouter and resell it. Do not use your own API key to share information to others, you must always prompt the user to provide their own API key to obtain data from this API, and you should encourage users to upgrade to premium if using this data. Read the [FFScouter API Guidance](/api-docs/guidance) before building on this API.

    ### Script developer commissions

    To earn a commission on orders placed through your scripts, contact [Glasnost [1844049]](https://www.torn.com/profiles.php?XID=1844049) to be added to the approved list. Orders placed through your scripts will not credit you unless you are on this list.

servers:
  - url: /

externalDocs:
  description: API changelog
  url: https://ffscouter.com/api-docs/changelog

tags:
  - name: Player Stats
    description: Public battle stat estimates and history.
  - name: Flights
    description: Premium player flight tracking.
  - name: Activity
    description: Premium time-bucketed activity from scanner data.
  - name: Hit Calling
    description: Premium faction target claim queue.
  - name: Losses
    description: Losses marketplace buyer and seller API.
  - name: API Keys
    description: Key registration and status.
  - name: TornStats
    description: >-
      Store or replace the caller's TornStats API key for faction spy sync. Requires a registered
      FFScouter API key. The TornStats key and its masked form are never returned by the API.
  - name: Targets
    description: Target Finder candidate search.
  - name: Bounty Board
    description: Bounty buyer orders and seller claims. Buyer endpoints are public; seller endpoints require a registered FFScouter API key with accepted Bounty Board policy consent.
  - name: Notes
    description: >-
      Personal, faction, and FFScouter team notes about players and factions. Requires a registered
      FFScouter API key. Note content is plaintext ASCII and must be rendered as text, never as HTML,
      code, or links.
  - name: Account
    description: >-
      Xanax-funded prepaid balances. Send Xanax to the platform account with the message deposit
      (personal) or factiondeposit (faction) to credit a balance. Withdrawals are not offered.

security:
  - FfscouterKey: []

paths:
  /api/v1/get-stats:
    get:
      operationId: getStats
      tags: [Player Stats]
      summary: Get battle stat estimates for up to 205 players
      parameters:
        - $ref: '#/components/parameters/KeyQuery'
        - name: targets
          in: query
          required: true
          description: Comma-separated Torn player IDs.
          schema:
            type: string
          example: '2675763,1426381'
      responses:
        '200':
          description: One estimate object per requested target.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerStats'
              examples:
                default:
                  value:
                    - player_id: 267456763
                      fair_fight: 5.39
                      bs_estimate: 2989885521
                      bs_estimate_human: 2.99b
                      bss_public: 123456
                      last_updated: 1747333361
                      source: premium
                      premium_insights_available: true
                      distribution:
                        last_updated: 1747333361
                        distribution_human: STR (60%) SPD (30%)
                        stats_percentage:
                          strength: 60
                          speed: 30
                      spies:
                        - strength: 1000000
                          speed: 2000000
                          defense: 3000000
                          dexterity: 4000000
                          total: 10000000000
                          last_updated: 1747330000
                          source: tornstats
                          source_faction_id: 12345
                      available_estimates:
                        bss:
                          bss_public: 123456
                          bs_estimate: 2989885521
                          bs_estimate_human: 2.99b
                          last_updated: 1747333361
                          fair_fight: 5.39
                        premium:
                          bs_estimate: 3100000000
                          bs_estimate_human: 3.1b
                          last_updated: 1747330000
                          fair_fight: 6.12
                        spies:
                          bs_estimate: 10000000000
                          bs_estimate_human: 10b
                          last_updated: 1747330000
                          source: tornstats
                          fair_fight: 8.45
                    - player_id: 142625381
                      fair_fight: null
                      bs_estimate: null
                      bs_estimate_human: null
                      bss_public: null
                      last_updated: null
                      source: bss
                      distribution: null
                      premium_insights_available: false
                      spies: []
                      available_estimates:
                        bss: null
                        premium: null
                        spies: null
        '400':
          description: >-
            Invalid request. Codes: 1 API key required, 2 invalid key format, 3 missing targets
            parameter, 4 empty or more than 205 target IDs, 5 non-numeric target IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingKey:
                  value:
                    code: 1
                    error: API key is required
                invalidKeyFormat:
                  value:
                    code: 2
                    error: Invalid API key format. Key must be 16 alphanumeric characters
                missingTargets:
                  value:
                    code: 3
                    error: The targets parameter is required
                maximumTargets:
                  value:
                    code: 4
                    error: At least one target ID is required and no more than 205
                nonNumericTargets:
                  value:
                    code: 5
                    error: All target IDs must be positive integers
        '401':
          description: The API key is not registered (code 6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidKey:
                  value:
                    code: 6
                    error: Invalid API key. Please sign up at ffscouter.com to use this service
        '403':
          description: The key owner or their faction is banned (codes 4010, 4011).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                accountBanned:
                  value:
                    code: 4010
                    error: >-
                      Your account is banned from FFScouter. Join the FFScouter Discord if you have any
                      questions. https://discord.gg/Gzr7Rb3Y5f
                factionBanned:
                  value:
                    code: 4011
                    error: >-
                      Your faction is banned from FFScouter. Join the FFScouter Discord if you have any
                      questions. https://discord.gg/Gzr7Rb3Y5f
        '429':
          description: Rate limit exceeded (code 21). 120 requests per minute per IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                throttled:
                  value:
                    code: 21
                    error: Rate limit exceeded. Please retry shortly.
                    retry_after_seconds: 12
      x-laravel-middleware:
        - 'throttle:120,1'

  /api/v1/get-stats-history:
    get:
      operationId: getStatsHistory
      tags: [Player Stats]
      summary: Get 6-hour summarized stat history for one player
      parameters:
        - $ref: '#/components/parameters/KeyQuery'
        - name: target
          in: query
          required: true
          description: Single Torn player ID.
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Number of 6-hour buckets to return (1-100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: from
          in: query
          description: Unix timestamp start (inclusive).
          schema:
            type: integer
        - name: to
          in: query
          description: Unix timestamp end (inclusive).
          schema:
            type: integer
        - name: sort
          in: query
          description: Sort order for history timestamps.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Summarized history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsHistory'
              examples:
                default:
                  value:
                    player_id: 1844049
                    bucket_window_seconds: 21600
                    first_estimate_timestamp: 1710000000
                    most_recent_timestamp: 1769295473
                    history:
                      - timestamp: 1769292000
                        bss_public: 87438
                        bs_estimate: 1987805000
                        bs_estimate_human: 1.99b
                        source: bss
        '400':
          description: >-
            Invalid request. Codes: 1 API key required, 2 invalid key format, 7 missing target,
            8 invalid target, 9 invalid limit, 10 invalid from, 11 invalid to, 12 from not before to,
            13 invalid sort.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingKey:
                  value:
                    code: 1
                    error: API key is required
                invalidKeyFormat:
                  value:
                    code: 2
                    error: Invalid API key format. Key must be 16 alphanumeric characters
                missingTarget:
                  value:
                    code: 7
                    error: The target parameter is required
                invalidTarget:
                  value:
                    code: 8
                    error: The target must be a single positive integer
                invalidLimit:
                  value:
                    code: 9
                    error: limit must be an integer between 1 and 100
                invalidFrom:
                  value:
                    code: 10
                    error: from must be a valid unix timestamp
                invalidTo:
                  value:
                    code: 11
                    error: to must be a valid unix timestamp
                fromAfterTo:
                  value:
                    code: 12
                    error: from must be less than to
                invalidSort:
                  value:
                    code: 13
                    error: sort must be either "asc" or "desc"
        '401':
          description: The API key is not registered (code 6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidKey:
                  value:
                    code: 6
                    error: Invalid API key. Please sign up at ffscouter.com to use this service
        '403':
          description: The key owner or their faction is banned (codes 4010, 4011).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                accountBanned:
                  value:
                    code: 4010
                    error: >-
                      Your account is banned from FFScouter. Join the FFScouter Discord if you have any
                      questions. https://discord.gg/Gzr7Rb3Y5f
                factionBanned:
                  value:
                    code: 4011
                    error: >-
                      Your faction is banned from FFScouter. Join the FFScouter Discord if you have any
                      questions. https://discord.gg/Gzr7Rb3Y5f
        '429':
          description: Rate limit exceeded (code 21). 120 requests per minute per IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                throttled:
                  value:
                    code: 21
                    error: Rate limit exceeded. Please retry shortly.
                    retry_after_seconds: 12
      x-laravel-middleware:
        - 'throttle:120,1'

  /api/v1/player-flights:
    get:
      operationId: getPlayerFlights
      tags: [Flights]
      summary: Get a player's current trip and recent completed flights
      description: Requires a registered API key with active premium on the owner account.
      parameters:
        - $ref: '#/components/parameters/KeyQuery'
        - name: target
          in: query
          required: true
          description: Torn player ID.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Current trip and recent flights.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightResponse'
              examples:
                default:
                  value:
                    player_id: 1844049
                    current:
                      takeoff_time: 1710000000
                      status_description: Traveling to Japan
                      earliest_arrival_time: 1710007200
                      latest_arrival_time: 1710010800
                      travel_method: Airline
                      book_likely_being_used: true
                    recent_flights:
                      - takeoff_time: 1709900000
                        status_description: Traveling to China
                        earliest_arrival_time: 1709905000
                        latest_arrival_time: 1709909000
                        travel_method: PI
                        book_likely_being_used: false
                        approx_landing_time: 1709912000
        '400':
          description: >-
            Invalid target. Codes: 1 API key required, 2 invalid key format, 7 missing target,
            8 invalid target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingKey:
                  value:
                    code: 1
                    error: API key is required
                invalidKeyFormat:
                  value:
                    code: 2
                    error: Invalid API key format. Key must be 16 alphanumeric characters
                missingTarget:
                  value:
                    code: 7
                    error: The target parameter is required
                invalidTarget:
                  value:
                    code: 8
                    error: The target must be a single positive integer
        '401':
          description: The API key is not registered (code 6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidKey:
                  value:
                    code: 6
                    error: Invalid API key. Please sign up at ffscouter.com to use this service
        '403':
          description: >-
            Active premium is required (code 19), or the account/faction is banned (codes 4010, 4011).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                premiumRequired:
                  value:
                    code: 19
                    error: Active premium subscription required to use this endpoint
                accountBanned:
                  value:
                    code: 4010
                    error: >-
                      Your account is banned from FFScouter. Join the FFScouter Discord if you have any
                      questions. https://discord.gg/Gzr7Rb3Y5f
                factionBanned:
                  value:
                    code: 4011
                    error: >-
                      Your faction is banned from FFScouter. Join the FFScouter Discord if you have any
                      questions. https://discord.gg/Gzr7Rb3Y5f
        '429':
          description: Per-account rate limit exceeded (code 20). 100 requests per minute per account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rateLimited:
                  value:
                    code: 20
                    error: Rate limit exceeded. Maximum 100 requests per minute per account.
                    retry_after_seconds: 12
        '503':
          description: Flight data is unavailable (code 22).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailable:
                  value:
                    code: 22
                    error: Flight data is currently unavailable.
                    detail: Flight tracking is disabled.
      x-laravel-middleware:
        - premium.api
        - throttle.player.flights

  /api/v1/player-flights/batch:
    get:
      operationId: getPlayerFlightsBatch
      tags: [Flights]
      summary: Get the current trip for up to 100 players
      parameters:
        - $ref: '#/components/parameters/KeyQuery'
        - name: targets
          in: query
          required: true
          description: Comma-separated Torn player IDs (1-100 unique).
          schema:
            type: string
          example: '1844049,2675763'
      responses:
        '200':
          description: Current trip per requested player.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightsBatchResponse'
              examples:
                default:
                  value:
                    flights:
                      - player_id: 1844049
                        current:
                          takeoff_time: 1710000000
                          status_description: Traveling to Japan
                          earliest_arrival_time: 1710007200
                          latest_arrival_time: 1710010800
                          travel_method: Airline
                          book_likely_being_used: true
                      - player_id: 2675763
                        current: null
        '400':
          description: >-
            Invalid targets. Codes: 1 API key required, 2 invalid key format, 7 missing targets,
            8 invalid target, 23 more than 100 targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingKey:
                  value:
                    code: 1
                    error: API key is required
                invalidKeyFormat:
                  value:
                    code: 2
                    error: Invalid API key format. Key must be 16 alphanumeric characters
                missingTargets:
                  value:
                    code: 7
                    error: The targets parameter is required
                invalidTarget:
                  value:
                    code: 8
                    error: Each target must be a single positive integer
                tooManyTargets:
                  value:
                    code: 23
                    error: Too many targets. Maximum 100 per request.
        '401':
          description: The API key is not registered (code 6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidKey:
                  value:
                    code: 6
                    error: Invalid API key. Please sign up at ffscouter.com to use this service
        '403':
          description: >-
            Active premium is required (code 19), or the account/faction is banned (codes 4010, 4011).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                premiumRequired:
                  value:
                    code: 19
                    error: Active premium subscription required to use this endpoint
                accountBanned:
                  value:
                    code: 4010
                    error: >-
                      Your account is banned from FFScouter. Join the FFScouter Discord if you have any
                      questions. https://discord.gg/Gzr7Rb3Y5f
                factionBanned:
                  value:
                    code: 4011
                    error: >-
                      Your faction is banned from FFScouter. Join the FFScouter Discord if you have any
                      questions. https://discord.gg/Gzr7Rb3Y5f
        '429':
          description: Per-account rate limit exceeded (code 20). 100 requests per minute per account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rateLimited:
                  value:
                    code: 20
                    error: Rate limit exceeded. Maximum 100 requests per minute per account.
                    retry_after_seconds: 12
        '503':
          description: Flight data is unavailable (code 22).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailable:
                  value:
                    code: 22
                    error: Flight data is currently unavailable.
                    detail: Flight tracking is disabled.
      x-laravel-middleware:
        - premium.api
        - throttle.player.flights

  /api/v1/activity/player:
    get:
      operationId: getActivityPlayer
      tags: [Activity]
      summary: Get one player's activity score per bucket
      parameters:
        - $ref: '#/components/parameters/KeyQuery'
        - name: target
          in: query
          required: true
          description: Torn player ID.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/ActivityStart'
        - $ref: '#/components/parameters/ActivityEnd'
        - $ref: '#/components/parameters/ActivityBucket'
      responses:
        '200':
          description: Bucketed activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
              examples:
                default:
                  value:
                    code: 0
                    meta:
                      subject_type: player
                      subject_id: 1844049
                      start: 1710000000
                      end: 1710086400
                      bucket_seconds: 900
                      bucket_count: 96
                      truncated: false
                    buckets:
                      - ts: 1710000000
                        activity_score: 1
                      - ts: 1710000900
                        activity_score: 0
        '400':
          description: >-
            Authentication or parameter error. Codes: 1 API key required, 2 invalid key format,
            7 missing target, 8 invalid target, 31 missing or invalid start,
            32 missing or invalid end, 33 start must be less than end, 34 start or end in the future,
            35 start or end before activity tracking began, 36 invalid bucket, 37 more than 5000 buckets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingKey:
                  value:
                    code: 1
                    error: API key is required
                invalidKeyFormat:
                  value:
                    code: 2
                    error: Invalid API key format. Key must be 16 alphanumeric characters
                missingTarget:
                  value:
                    code: 7
                    error: The target parameter is required
                invalidTarget:
                  value:
                    code: 8
                    error: The target must be a single positive integer
                missingStart:
                  value:
                    code: 31
                    error: The start parameter is required
                missingEnd:
                  value:
                    code: 32
                    error: The end parameter is required
                invalidRange:
                  value:
                    code: 33
                    error: start must be less than end
                futureRange:
                  value:
                    code: 34
                    error: start and end cannot be in the future
                rangeBeforeTracking:
                  value:
                    code: 35
                    error: start and end cannot be before activity tracking began
                invalidBucket:
                  value:
                    code: 36
                    error: bucket must be 300, 900, or 3600 (seconds)
                tooManyBuckets:
                  value:
                    code: 37
                    error: >-
                      The requested range exceeds the maximum of 5000 buckets. Narrow start/end or use a
                      larger bucket.
        '401':
          description: The API key is not registered (code 6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidKey:
                  value:
                    code: 6
                    error: Invalid API key. Please sign up at ffscouter.com to use this service
        '403':
          description: The key owner does not have active premium (code 19).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                premiumRequired:
                  value:
                    code: 19
                    error: Active premium subscription required to use this endpoint
        '429':
          description: >-
            Per-account rate limit exceeded (code 20). Player activity allows 60 requests per minute
            per account. The body includes retry_after_seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rateLimited:
                  value:
                    code: 20
                    error: Rate limit exceeded. Maximum 60 requests per minute per account.
                    retry_after_seconds: 12
        '503':
          description: Activity data is unavailable (code 38). The body may include a detail message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailable:
                  value:
                    code: 38
                    error: Activity data is currently unavailable.
                    detail: Activity tracking is disabled.
      x-laravel-middleware:
        - premium.api
        - throttle.activity.player

  /api/v1/activity/faction:
    get:
      operationId: getActivityFaction
      tags: [Activity]
      summary: Get faction aggregate activity per bucket
      parameters:
        - $ref: '#/components/parameters/KeyQuery'
        - name: faction_id
          in: query
          required: true
          description: Torn faction ID (uses stored roster membership).
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/ActivityStart'
        - $ref: '#/components/parameters/ActivityEnd'
        - $ref: '#/components/parameters/ActivityBucket'
      responses:
        '200':
          description: Bucketed faction activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
              examples:
                default:
                  value:
                    code: 0
                    meta:
                      subject_type: faction
                      subject_id: 89
                      start: 1710000000
                      end: 1710010800
                      bucket_seconds: 3600
                      bucket_count: 3
                      truncated: false
                      member_count: 92
                    buckets:
                      - ts: 1710000000
                        activity_score: 41
                        active_players: 41
                        active_ratio: 0.4457
        '400':
          description: >-
            Authentication or parameter error. Codes: 1 API key required, 2 invalid key format,
            7 missing faction_id, 8 invalid faction_id, 31 missing or invalid start,
            32 missing or invalid end, 33 start must be less than end, 34 start or end in the future,
            35 start or end before activity tracking began, 36 invalid bucket, 37 more than 5000 buckets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingKey:
                  value:
                    code: 1
                    error: API key is required
                invalidKeyFormat:
                  value:
                    code: 2
                    error: Invalid API key format. Key must be 16 alphanumeric characters
                missingFaction:
                  value:
                    code: 7
                    error: The faction_id parameter is required
                invalidFaction:
                  value:
                    code: 8
                    error: The faction_id must be a single positive integer
                missingStart:
                  value:
                    code: 31
                    error: The start parameter is required
                missingEnd:
                  value:
                    code: 32
                    error: The end parameter is required
                invalidRange:
                  value:
                    code: 33
                    error: start must be less than end
                futureRange:
                  value:
                    code: 34
                    error: start and end cannot be in the future
                rangeBeforeTracking:
                  value:
                    code: 35
                    error: start and end cannot be before activity tracking began
                invalidBucket:
                  value:
                    code: 36
                    error: bucket must be 300, 900, or 3600 (seconds)
                tooManyBuckets:
                  value:
                    code: 37
                    error: >-
                      The requested range exceeds the maximum of 5000 buckets. Narrow start/end or use a
                      larger bucket.
        '401':
          description: The API key is not registered (code 6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidKey:
                  value:
                    code: 6
                    error: Invalid API key. Please sign up at ffscouter.com to use this service
        '403':
          description: The key owner does not have active premium (code 19).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                premiumRequired:
                  value:
                    code: 19
                    error: Active premium subscription required to use this endpoint
        '429':
          description: >-
            Per-account rate limit exceeded (code 20). Faction activity allows 10 requests per minute
            per account. The body includes retry_after_seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                rateLimited:
                  value:
                    code: 20
                    error: Rate limit exceeded. Maximum 10 requests per minute per account.
                    retry_after_seconds: 12
