                noSlotsRemaining:
                  value:
                    code: 53
                    error: No slots remaining on this contract.
                insufficientSlots:
                  value:
                    code: 70
                    error: Not enough slots available on this contract.
        '429':
          description: Rate limit exceeded (code 21). 20 requests per minute per IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                throttled:
